<section class="about-section">
  <div class="about-glow glow-a"></div>
  <div class="about-glow glow-b"></div>

  <div class="container">
    <div class="row align-items-center g-5">
      <div class="col-lg-5">
        <div class="about-pill"><i class="fas fa-circle-dot"></i><span>The Adcuesta approach</span></div>
        <h2 class="about-title">We turn powerful AI <span class="gradient-text">into products people want to use.</span></h2>
        <p class="about-text">Curious by nature. Practical by design. Focused on the moment technology becomes genuinely helpful.</p>
        <a href="#capabilities" class="about-link" (click)="scrollTo('capabilities', $event)">
          Explore our capabilities <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>

      <div class="col-lg-7">
        <div class="row g-4">
          <div class="col-sm-6" *ngFor="let pillar of pillars">
            <div class="pillar-card" [style.--pillar-color]="pillar.color">
              <div class="pillar-top">
                <div class="pillar-icon"><i [class]="pillar.icon"></i></div>
                <span class="pillar-number">{{ pillar.number }}</span>
              </div>
              <h3 class="pillar-title">{{ pillar.title }}</h3>
              <p class="pillar-detail">{{ pillar.detail }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
