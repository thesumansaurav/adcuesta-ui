<section class="featured-section bg-color-1">
  <div class="bubble-dotted">
    <span class="dotted dotted-1"></span>
    <span class="dotted dotted-2"></span>
    <span class="dotted dotted-3"></span>
    <span class="dotted dotted-4"></span>
    <span class="dotted dotted-5"></span>
    <span class="dotted dotted-6"></span>
    <span class="dotted dotted-7"></span>
    <span class="dotted dotted-8"></span>
    <span class="dotted dotted-9"></span>
    <span class="dotted dotted-10"></span>
  </div>

  <div class="container">
    <div class="sec-title text-center">
      <div class="title"><i class="fas fa-brain"></i><span>AI capabilities</span></div>
      <h3>Ideas in. <span class="gradient-text">Intelligence out.</span></h3>
      <p>The building blocks behind our next generation of products.</p>
    </div>

    <div class="row g-4 justify-content-center">
      <div 
        *ngFor="let item of capabilities; let i = index" 
        class="col-lg-4 col-md-6 col-sm-12 feature-block"
      >
        <div class="feature-block-one">
          <div class="hover-content"></div>
          <div class="inner-box">
            <div class="card-header-meta">
              <div class="icon-box" [style.--accent-color]="item.color">
                <i [class]="item.icon"></i>
              </div>
              <span class="card-number">{{ item.number }}</span>
            </div>
            
            <h4 class="card-title">{{ item.title }}</h4>
            <div class="text">
              <p>{{ item.detail }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
