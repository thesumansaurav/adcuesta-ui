<section class="fun-facts mvas-fun-facts">
  <div class="map-shap" style="background-image: url('../../../../../images/map-shap-1.png');"></div>
  <div class="container">

    <div class="row g-4 justify-content-center">
      <div 
        *ngFor="let stat of stats" 
        class="col-lg-3 col-md-6 col-sm-12 block-column"
      >
        <div class="counter-block-one">
          <div class="counter-block">
            <div class="count-outer">
              <span class="count-text" [style.background]="stat.colorGradient">{{ stat.value }}</span>
              <span class="suffix" *ngIf="stat.suffix">{{ stat.suffix }}</span>
            </div>
            <h3><span>{{ stat.titlePrefix }}</span> {{ stat.titleSuffix }}</h3>
            <p class="stat-sub" *ngIf="stat.sub">{{ stat.sub }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
