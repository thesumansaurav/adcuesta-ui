<section class="architecture-section">
  <div class="container">
    <div class="sec-title text-center">
      <div class="title"><i class="fas fa-microchip"></i><span>Technical architecture</span></div>
      <h3>How our intelligence layer <span class="gradient-text">works</span></h3>
      <p>Engineered specifically for telecom operator constraints: ultra-low latency, strict regulatory compliance, and scalable personalization.</p>
    </div>

    <div class="row g-4 justify-content-center">
      <div 
        *ngFor="let layer of layers" 
        class="col-lg-4 col-md-6 col-sm-12"
      >
        <div class="arch-card" [style.--arch-color]="layer.color">
          <div class="arch-top">
            <span class="layer-pill">{{ layer.number }}</span>
            <div class="arch-icon">
              <i [class]="layer.icon"></i>
            </div>
          </div>

          <h4 class="layer-name">{{ layer.name }}</h4>
          <div class="layer-tagline">{{ layer.tagline }}</div>
          <p class="layer-desc">{{ layer.description }}</p>

          <div class="layer-points">
            <div class="point-item" *ngFor="let point of layer.points">
              <i class="fas fa-angle-right"></i>
              <span>{{ point }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
