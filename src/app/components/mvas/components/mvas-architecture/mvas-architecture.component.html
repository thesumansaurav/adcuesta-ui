<section class="architecture-section">
  <div class="container">
    <div class="sec-title text-center">
      <div class="title"><i class="fas fa-microchip"></i><span>AI architecture</span></div>
      <h3>The intelligence layer behind <span class="gradient-text">every experience.</span></h3>
      <p>Connect. Understand. Create. Improve.</p>
    </div>

    <div class="row g-4 justify-content-center">
      <div 
        *ngFor="let layer of layers" 
        class="col-lg-3 col-md-6 col-sm-12"
      >
        <div class="arch-card" [style.--arch-color]="layer.color">
          <div class="arch-top">
            <span class="layer-pill">{{ layer.number }}</span>
            <div class="arch-icon">
              <i [class]="layer.icon"></i>
            </div>
          </div>

          <h4 class="layer-name">{{ layer.name }}</h4>
          <p class="layer-desc">{{ layer.description }}</p>

          <div class="layer-points">
            <div class="point-item" *ngFor="let point of layer.points">
              <i class="fas fa-angle-right"></i>
              <span>{{ point }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex flex-wrap justify-content-center align-items-center gap-4 mt-5">
      <span *ngFor="let step of flow" class="d-inline-flex align-items-center gap-2 fw-bold text-uppercase" style="font-size: 12px; letter-spacing: 0.14em;">
        <span style="width: 8px; height: 8px; border-radius: 50%;" [style.background]="step.color"></span>{{ step.label }}
      </span>
    </div>
  </div>
</section>
